<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TEDAŞ Asistan">
    <title>TEDAŞ Topraklamalar - Canlı Kamera & Sesli Asistan</title>
    <link rel="manifest" id="manifest-placeholder">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
        }
        header {
            background-color: var(--card-bg);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 16px;
            color: #fbbf24;
        }
        .header-actions {
            display: flex;
            gap: 8px;
        }
        .btn-sm {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-sm.active {
            background: var(--primary);
            border-color: var(--primary);
        }
        .camera-container {
            position: relative;
            flex: 1;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .scan-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .scan-box {
            width: 82%;
            height: 45%;
            border: 2px dashed rgba(56, 189, 248, 0.8);
            border-radius: 16px;
            box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.45);
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 12px;
        }
        .scan-hint {
            background: rgba(15, 23, 42, 0.85);
            color: #e2e8f0;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .status-pill {
            position: absolute;
            top: 14px;
            background: rgba(15, 23, 42, 0.88);
            color: #f8fafc;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .bottom-panel {
            background: var(--card-bg);
            padding: 14px 16px 18px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }
        .controls-row {
            display: flex;
            gap: 10px;
        }
        .btn-main {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-start { background: var(--success); }
        .btn-stop { background: var(--danger); }
        .btn-now { background: var(--primary); }
        .btn-switch {
            width: 48px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
        .result-box {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px;
            min-height: 95px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.5;
            color: #e2e8f0;
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 50;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal.open { display: flex; }
        .modal-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.15);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .modal-card h3 { font-size: 17px; color: #fbbf24; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 13px; color: var(--text-muted); }
        .form-group input, .form-group select {
            background: var(--bg-dark);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
        }
        .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
    </style>
</head>
<body>

<header>
    <div class="brand">⚡ TEDAŞ Topraklamalar</div>
    <div class="header-actions">
        <button id="btnAudio" class="btn-sm active" onclick="toggleAudio()">🔊 Ses Açık</button>
        <button class="btn-sm" onclick="openSettings()">⚙ API</button>
    </div>
</header>

<div class="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <div class="scan-overlay">
        <div id="statusPill" class="status-pill">Kamera Hazır</div>
        <div class="scan-box">
            <div class="scan-hint">Soruyu çerçeveye ortalayın</div>
        </div>
    </div>
</div>

<div class="bottom-panel">
    <div class="controls-row">
        <button id="btnToggleScan" class="btn-main btn-start" onclick="toggleAutoScan()">▶ Canlı Taramayı Başlat</button>
        <button class="btn-main btn-now" onclick="captureAndAnalyze()">⚡ Şimdi Oku</button>
        <button class="btn-switch" onclick="switchCamera()" title="Kamerayı Çevir">🔄</button>
    </div>
    <div id="resultBox" class="result-box">
        Soruyu kameraya gösterip <b>Şimdi Oku</b> veya <b>Canlı Taramayı Başlat</b> butonuna basın.
    </div>
</div>

<div id="settingsModal" class="modal">
    <div class="modal-card">
        <h3>⚙ API ve Asistan Ayarları</h3>
        <div class="form-group">
            <label>Gemini API Anahtarı</label>
            <input type="password" id="apiKeyInput" placeholder="AIzaSy...">
        </div>
        <div class="form-group">
            <label>Otomatik Tarama Aralığı (Saniye)</label>
            <select id="intervalSelect">
                <option value="3500">3.5 Saniye</option>
                <option value="5000" selected>5 Saniye</option>
                <option value="8000">8 Saniye</option>
            </select>
        </div>
        <div class="form-group">
            <label>Konuşma Hızı</label>
            <select id="rateSelect">
                <option value="0.95">Normal (0.95x)</option>
                <option value="1.1" selected>Hızlı (1.1x)</option>
                <option value="1.25">Çok Hızlı (1.25x)</option>
            </select>
        </div>
        <div class="modal-actions">
            <button class="btn-main" style="background:#475569" onclick="closeSettings()">İptal</button>
            <button class="btn-main btn-now" onclick="saveSettings()">Kaydet</button>
        </div>
    </div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    const manifest = {
        name: "TEDAŞ Topraklamalar Asistanı",
        short_name: "TEDAŞ Kamera",
        start_url: ".",
        display: "standalone",
        background_color: "#0f172a",
        theme_color: "#0f172a",
        icons: [{
            src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f172a'/><text y='.9em' font-size='75' x='12'>⚡</text></svg>",
            sizes: "192x192",
            type: "image/svg+xml"
        }]
    };
    document.getElementById('manifest-placeholder').setAttribute('href', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest)));

    let stream = null;
    let facingMode = "environment";
    let isScanning = false;
    let scanTimer = null;
    let audioEnabled = true;
    let isProcessing = false;

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const statusPill = document.getElementById('statusPill');
    const resultBox = document.getElementById('resultBox');

    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
        document.getElementById('intervalSelect').value = localStorage.getItem('scan_interval') || '5000';
        document.getElementById('rateSelect').value = localStorage.getItem('speech_rate') || '1.1';
        startCamera();
    });

    async function startCamera() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            });
            video.srcObject = stream;
            statusPill.innerText = "Kamera Aktif 🟢";
        } catch (err) {
            statusPill.innerText = "Kamera Hatası ❌";
            resultBox.innerHTML = `<span style="color:#f87171;">Kamera erişimi reddedildi veya başlatılamadı: ${err.message}</span>`;
        }
    }

    function switchCamera() {
        facingMode = facingMode === "environment" ? "user" : "environment";
        startCamera();
    }

    function toggleAudio() {
        audioEnabled = !audioEnabled;
        const btn = document.getElementById('btnAudio');
        if (audioEnabled) {
            btn.classList.add('active');
            btn.innerText = "🔊 Ses Açık";
        } else {
            btn.classList.remove('active');
            btn.innerText = "🔇 Ses Kapalı";
            window.speechSynthesis.cancel();
        }
    }

    function openSettings() {
        document.getElementById('settingsModal').classList.add('open');
    }

    function closeSettings() {
        document.getElementById('settingsModal').classList.remove('open');
    }

    function saveSettings() {
        const key = document.getElementById('apiKeyInput').value.trim();
        const interval = document.getElementById('intervalSelect').value;
        const rate = document.getElementById('rateSelect').value;
        localStorage.setItem('gemini_api_key', key);
        localStorage.setItem('scan_interval', interval);
        localStorage.setItem('speech_rate', rate);
        closeSettings();
        if (isScanning) {
            toggleAutoScan();
            toggleAutoScan();
        }
    }

    function toggleAutoScan() {
        const btn = document.getElementById('btnToggleScan');
        if (isScanning) {
            isScanning = false;
            clearInterval(scanTimer);
            btn.className = "btn-main btn-start";
            btn.innerHTML = "▶ Canlı Taramayı Başlat";
            statusPill.innerText = "Tarama Durduruldu";
        } else {
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                openSettings();
                return;
            }
            isScanning = true;
            btn.className = "btn-main btn-stop";
            btn.innerHTML = "⏹ Taramayı Durdur";
            captureAndAnalyze();
            const interval = parseInt(localStorage.getItem('scan_interval') || '5000');
            scanTimer = setInterval(captureAndAnalyze, interval);
        }
    }

    function speakText(text) {
        if (!audioEnabled || !('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'tr-TR';
        utterance.rate = parseFloat(localStorage.getItem('speech_rate') || '1.1');
        window.speechSynthesis.speak(utterance);
    }

    async function captureAndAnalyze() {
        if (isProcessing || !video.videoWidth) return;
        const apiKey = localStorage.getItem('gemini_api_key');
        if (!apiKey) {
            resultBox.innerHTML = `<span style="color:#fbbf24;">Lütfen sağ üstteki <b>⚙ API</b> butonundan Gemini API anahtarınızı girin.</span>`;
            openSettings();
            return;
        }

        isProcessing = true;
        statusPill.innerText = "Soru Analiz Ediliyor... ⏳";

        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const cropW = vw * 0.85;
        const cropH = vh * 0.50;
        const cropX = (vw - cropW) / 2;
        const cropY = (vh - cropH) / 2;

        canvas.width = cropW;
        canvas.height = cropH;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

        const base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

        const promptText = `Sen TEDAŞ Elektrik Tesislerinde Topraklamalar Yönetmeliği ve elektrik mühendisliği konusunda uzman bir sınav asistanısın. 
Görüntüdeki soruyu dikkatlice oku. Eğer görüntüde net bir soru yoksa sadece "Çerçevede net bir soru görünmüyor." yaz.
Eğer bir soru varsa:
1. Doğru şıkkı ve cevabı en başta net bir şekilde söyle (Örn: "Doğru cevap C şıkkı: ...").
2. Ardından yönetmeliğe göre çok kısa (1-2 cümle) net bir açıklama yap. Sesli okunacağı için sembol veya gereksiz işaret kullanma.`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: promptText },
                            { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                        ]
                    }]
                })
            });

            const data = await response.json();

            if (!response.ok) {
                const errMsg = data.error?.message || "Bilinmeyen API hatası";
                statusPill.innerText = "API Hatası ❌";
                resultBox.innerHTML = `<span style="color:#f87171;"><b>Hata:</b> ${errMsg}</span>`;
            } else {
                const answer = data.candidates?.[0]?.content?.parts?.[0]?.text || "Yanıt alınamadı.";
                statusPill.innerText = "Okundu ✅";
                resultBox.innerText = answer;
                if (!answer.includes("net bir soru görünmüyor")) {
                    speakText(answer);
                }
            }
        } catch (err) {
            statusPill.innerText = "Bağlantı Hatası ❌";
            resultBox.innerHTML = `<span style="color:#f87171;">İnternet veya sunucu hatası: ${err.message}</span>`;
        } finally {
            isProcessing = false;
        }
    }
</script>
</body>
</html>
