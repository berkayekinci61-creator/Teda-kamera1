<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TEDAŞ Topraklamalar - Canlı Kamera v3.0</title>
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22TEDA%C5%9E%20Topraklamalar%22%2C%22short_name%22%3A%22TEDA%C5%9E%20Kamera%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%230f172a%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%3Butf8%2C%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20rx%3D%2720%27%20fill%3D%27%231e293b%27%2F%3E%3Ctext%20x%3D%2750%27%20y%3D%2768%27%20font-size%3D%2760%27%20text-anchor%3D%27middle%27%3E%E2%9A%A1%3C%2Ftext%3E%3C%2Fsvg%3E%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b1120; color: #f8fafc; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
        
        /* Header */
        header { background-color: #162032; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; z-index: 10; }
        .brand { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 16px; color: #fbbf24; }
        .header-btns { display: flex; gap: 8px; }
        .btn-top { background-color: #1e293b; color: #e2e8f0; border: 1px solid #334155; padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .btn-top.active { background-color: #1d4ed8; border-color: #3b82f6; color: #fff; }
        
        /* Status Badge */
        .status-bar { display: flex; justify-content: center; padding: 8px; z-index: 10; }
        #statusBadge { background-color: #1e293b; color: #cbd5e1; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid #334155; }
        
        /* Camera Viewport */
        .camera-container { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .scan-frame { position: absolute; width: 88%; height: 46%; border: 2px dashed #38bdf8; border-radius: 16px; box-shadow: 0 0 0 9999px rgba(11, 17, 32, 0.55); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px; pointer-events: none; }
        .scan-hint { background: rgba(15, 23, 42, 0.85); color: #f8fafc; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 500; }
        
        /* Controls */
        .controls-area { background-color: #0f172a; padding: 12px 14px 18px; border-top: 1px solid #1e293b; display: flex; flex-direction: column; gap: 10px; z-index: 10; }
        .btn-row { display: flex; gap: 8px; }
        .btn-main { flex: 1; padding: 13px 10px; border: none; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; color: #fff; transition: opacity 0.2s; }
        .btn-main:active { opacity: 0.8; }
        .btn-green { background-color: #16a34a; }
        .btn-red { background-color: #dc2626; }
        .btn-blue { background-color: #2563eb; }
        .btn-switch { width: 48px; background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; color: #e2e8f0; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        /* Output Box */
        .result-box { background-color: #162032; border: 1px solid #283548; border-radius: 12px; padding: 12px; min-height: 78px; max-height: 135px; overflow-y: auto; font-size: 13.5px; line-height: 1.45; color: #e2e8f0; }
        .result-box.error { border-color: #ef4444; background-color: #2a1215; color: #fca5a5; }
        .result-box.success { border-color: #22c55e; background-color: #0f291e; color: #dcfce7; }
        
        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
        .modal { background: #1e293b; border: 1px solid #334155; border-radius: 16px; width: 100%; max-width: 400px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
        .modal h3 { font-size: 17px; color: #fbbf24; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 13px; color: #cbd5e1; font-weight: 600; }
        .form-group input, .form-group select { background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 14px; }
        .modal-actions { display: flex; gap: 8px; margin-top: 6px; }
        canvas { display: none; }

<body>

<header>
    <div class="brand">⚡ TEDAŞ Topraklamalar</div>
    <div class="header-btns">
        <button id="btnAudio" class="btn-top active" onclick="toggleAudio()">🔊 Ses Açık</button>
        <button class="btn-top" onclick="openSettings()">⚙ API</button>
    </div>
</header>

<div class="status-bar">
    <div id="statusBadge">Kamera Hazır (v3.0 - S. 256-272 Yüklü)</div>
</div>

<div class="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <div class="scan-frame">
        <div class="scan-hint">Soruyu çerçeveye ortalayın</div>
    </div>
</div>

<div class="controls-area">
    <div class="btn-row">
        <button id="btnAuto" class="btn-main btn-green" onclick="toggleAutoScan()">▶ Canlı Taramayı Başlat</button>
        <button id="btnNow" class="btn-main btn-blue" onclick="captureAndAnalyze()">⚡ Şimdi Oku</button>
        <button class="btn-switch" onclick="switchCamera()" title="Kamera Değiştir">🔄</button>
    </div>
    <div id="resultBox" class="result-box">
        TEDAŞ Topraklamalar (v3.0 - Sayfa 256–272) tam bilgi bankası ve 5 kademeli yedek model sistemi yüklendi. Soruyu çerçeveye tutup "Şimdi Oku" butonuna basın.
    </div>
</div>

<!-- Settings Modal -->
<div id="settingsModal" class="modal-overlay">
    <div class="modal">
        <h3>⚙ Uygulama & API Ayarları</h3>
        <div class="form-group">
            <label>Gemini API Anahtarı (AIzaSy...)</label>
            <input type="password" id="apiKeyInput" placeholder="AIzaSy...">
        </div>
        <div class="form-group">
            <label>Otomatik Tarama Aralığı (Saniye)</label>
            <select id="intervalSelect">
                <option value="4000">4 Saniye</option>
                <option value="6000" selected>6 Saniye (Önerilen)</option>
                <option value="9000">9 Saniye</option>
            </select>
        </div>
        <div class="form-group">
            <label>Sesli Okuma Hızı</label>
            <select id="rateSelect">
                <option value="0.9">Yavaş (0.9x)</option>
                <option value="1.05" selected>Normal (1.05x)</option>
                <option value="1.25">Hızlı (1.25x)</option>
            </select>
        </div>
        <div class="modal-actions">
            <button class="btn-main btn-blue" onclick="saveSettings()">Kaydet</button>
            <button class="btn-main" style="background:#334155;" onclick="closeSettings()">Kapat</button>
        </div>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
const TEDAS_KNOWLEDGE_BASE = `
KAYNAK: TEDAŞ (Türkiye Elektrik Dağıtım A.Ş.) - 12. BÖLÜM: TOPRAKLAMALAR (Sayfa 256-272 Tam Metin Özeti)

[SAYFA 256 - TOPRAKLAMA TANIMI, AMAÇLARI VE ELEMANLARI]
- Tanım: Tesislerin gerilim altında olmayan kısımlarının ve bazı teçhizatın yıldız noktasının uygun iletkenlerle yer kütle içerisine yerleştirilmiş bir topraklayıcıya bağlanmasına topraklama denir.
- İki Ana Amaç:
  1) Topraklanacak cihaz veya bölüm ile referans toprak arasındaki direncin olabildiğince küçük olmasını sağlamak; oluşabilecek hata akımını mümkün olduğunca büyütmek.
  2) İşletme esnasında; cihazların, bina aksamının ve benzeri elemanların arasında oluşabilecek potansiyel farkı engellemek.
- Topraklama Elemanları ikiye ayrılır: 1) Topraklayıcılar, 2) Topraklama İletkenleri.
- Topraklayıcı Ebatları:
  * 2 m boyunda NPL 65 x 65 x 7 mm galvanizli çelik profil
  * 2 m boyunda; 3 mm et kalınlığında, 2,5 parmak (6,35 cm) çapında galvanizli boru
  * 2,5 m boyunda; 3 mm bakır kaplı, 22 mm çapında çelik çubuk
  * 0,5 x 1 m ebatında 3 mm et kalınlığında galvanizli çelik levha
- Topraklama İletkenleri ve Kesitleri:
  * 1x50 mm²'lik NYY kablo: İşletme topraklamasında (kullanılan transformatör güçlerine bağlı kesiti artırılır).
  * 35 mm² kesitinde çıplak örgülü bakır iletken: Saha dağıtım kutusu (SDK) ve aydınlatma tesislerindeki koruma topraklamasında.
  * 95 mm² galvanizli örgülü çelik iletken: ENH koruma topraklamasında ve parafudr topraklamalarında.
  * 35x3 mm (100 mm²) boyutunda galvanizli çelik şerit: Koruma topraklamalarında.
  * 95 mm² kesitinde çıplak örgülü bakır iletken: Dağıtım ve transformatör merkezlerinde koruma topraklamasında.

[SAYFA 257 - TOPRAKLAMANIN SINIFLANDIRILMASI]
1) Çeşitlerine Göre Topraklama:
   - Dolaysız Topraklama: Topraklama direncinden başka hiçbir direnç içermeyen topraklamadır.
   - Dolaylı Topraklama: Topraklama iletkeni üzerine ek olarak bağlanan omik, endüktif veya kapasitif dirençlerle yapılan topraklamadır.
   - Açık Topraklama: Topraklama iletkeni üzerine bir parafudr veya eklatör bağlanan topraklamadır.
2) Amaçlarına Göre Topraklama:
   - Koruma Topraklaması
   - İşletme Topraklaması
   - Fonksiyonel Topraklama
3) Şekillerine Göre Topraklama:
   - Münferit Topraklama: İşletme elemanı veya cihazın kendine ait topraklayıcıya bağlı olduğu topraklamadır.
   - Yıldız Topraklama: Topraklama iletkenlerinin, topraklanmış bir noktada yıldız şeklinde toplanmasıdır.
   - Çoklu Topraklama: Bir işletme elemanı veya cihazın topraklanmış birçok iletkene bağlandığı topraklamadır.
   - Yüzeysel Topraklama: Akım taşımayan iletken kısımların ağ şeklinde kendi aralarında koruma veya fonksiyon topraklamasına bağlandığı topraklamadır.

[SAYFA 258-259 - AMAÇLARINA GÖRE TOPRAKLAMA DETAYLARI VE MAHALLİ TOPRAKLAMA]
- Koruma Topraklaması: Uygun işletme şartları içerisinde gerilim altında bulunmayan, ancak arıza oluştuğunda gerilim altında olabilecek metal bölümlerin bir iletken yolu ile topraklayıcıya bağlanmasıdır. Amaç: Hata halinde insan vücudu üzerinden geçebilecek akımı oldukça az tutmak ve devredeki koruma cihazlarının çalışmasını sağlayarak arızalı kısmın hızla devre dışı olmasını sağlamaktır.
- İşletme Topraklaması: Transformatörlerin veya jeneratörlerin dışarı çıkartılmış yıldız (nötr) noktalarında toprağa karşı oluşacak gerilimin sınırlandırılması için yapılan topraklamadır. (Uygulama: Direk tipi trafolar, AG direkleri, SDK ve aydınlatma direkleri, müşterek direkler, TR ve Kök binaları).
- Fonksiyonel (Özel) Topraklama: Tesisin veya işletme elemanının istenen fonksiyonu yerine getirmesi amacıyla yapılan topraklamadır (Paratoner topraklama, raylı sistem topraklama, zayıf akım topraklama, mahalli topraklama).
- Mahalli Topraklama: Çalışma mahallinin en yakın yerinde yapılan topraklamalardır. Arıza ve bakım hallerinde enerjisi kesilmiş tesislerde güvenli çalışmayı sağlamak amacıyla yapılır (kısa devre topraklama aparatları ile).

[SAYFA 260-261 - DAĞITIM ŞEBEKELERİNİN SINIFLANDIRILMASI (TT, IT, TN)]
- 1. Harf (Güç sisteminin toprağa bağlantısı): T = Bir noktanın toprağa doğrudan bağlandığı; I = Bütün gerilimli bölümlerin topraktan ayrılmış olması veya bir noktadan empedans üzerinden bağlandığı.
- 2. Harf (Tesisatın açıktaki iletken bölümlerinin toprağa bağlantısı): T = Güç sisteminin topraklamasından bağımsız olarak doğrudan toprağa bağlandığı; N = Güç sisteminin topraklanmış noktasına (nötr) elektriksel olarak doğrudan bağlandığı.
- Sonraki Harfler (Varsa): S = Nötr (N) ve koruma (PE) iletkenlerinin ayrı olduğu; C = Nötr ve koruma fonksiyonlarının tek iletkende birleştirildiği (PEN).
- Sistemler: TT sistemi, IT sistemi, TN-S (sistemin tamamında ayrı koruma iletkeni), TN-C (tamamında PEN iletkeni), TN-C-S (bir bölümünde PEN, sonra PE ve N ayrı).

[SAYFA 262-268 - ŞEMA ÖLÇÜLERİ VE UYGULAMA KURALLARI]
- Parafudrlar en kısa yoldan kesintisiz ayrı bir 95 mm² örgülü çelik iletkenle topraklayıcıya bağlanır; topraklama iletkenine fleksibl iletkenle irtibatlandırılır.
- İşletme topraklaması ile koruma topraklaması arasında EN AZ 20 metre mesafe olmalıdır.
- Topraklayıcı kazık/profil boyu: 2 m; Gömülme derinliği: En az 50 cm (0,5-1 m).
- (a) mesafesi (kazı uzunluğu) topraklayıcı boyunun iki katı olacaktır (2 m x 2 = 4 metre).
- Direk üzerinde kablo koruması: 2,15 m boyunda gaz borusu veya PVC boru.
- SDK (Saha Dağıtım Kutusu) ile aydınlatma direklerinin kablosu aynı kanala döşendiği takdirde topraklama iletkeni (1x35 mm² çıplak örgülü bakır) her ikisi için birlikte kullanılır.
- Bina tipi trafo tesisi (TR ve KÖK) ve indirici/dağıtım merkezlerinde ızgara topraklama sistemi uygulanır; şebeke en az 50 cm toprak altına gömülür, kazıkların bulunduğu yerlere 40x40 cm rögar yapılır.

[SAYFA 269 - TEMEL TOPRAKLAMA VE DİKKAT EDİLECEK HUSUSLAR]
- Temel topraklamada en az 150 cm'lik bağlantı filizi bırakılır.
- Dikkat Edilecek Hususlar:
  1) Havai hat şebekelerinde işletme ve koruma topraklamaları mümkün olduğunca hat güzergahı altına gelmemelidir.
  2) İşletme topraklamalarına ait iletken arıza dışında da gerilim altında olabileceğinden izole kablo (1kV 50 mm² NYY) olarak tesis edilmelidir.
  3) Topraklayıcı olarak uygun elektrot (2 m boyunda NPL 65x65x7 mm galvanizli profil) kullanılmalıdır.
  4) İstenen toprak geçiş direnç değeri sağlanamadığı takdirde, topraklayıcı yapım şekli ve sayıları artırılarak paralel bağlanıp direnç düşürülür (elektrot sayısı artınca direnç azalır).
  5) Topraklayıcılar arasındaki mesafe elektrot uzunluğunun en az 2 katı olmalıdır.
  6) 1kV 50 mm² NYY kablo direk temel üstünden başlamak üzere 2 m boyunda gaz borusu veya PVC ile muhafaza altına alınmalıdır.
  7) Topraklama şeridi veya iletkeni yüzeyden 0,5-1 m derinliğe gömülmelidir.
  8) İşletme topraklaması ile koruma topraklaması arasında en az 20 metre mesafe olmalıdır.

[SAYFA 270-272 - TOPRAKLAMA DİRENCİ ÖLÇÜMÜ VE DENETİM PERİYOTLARI]
- Ölçüm Cihazı (Meger) Bağlantıları:
  * E (Toprak ucu): Yeşil renkli kablo -> Ölçülecek topraklama elektrotuna bağlanır.
  * P (Gerilim ucu): Sarı renkli kablo -> Topraklama elektrotundan 5-10 metre ileriye çakılan 1 no.lu topraklama çubuğuna bağlanır.
  * C (Akım ucu): Kırmızı renkli kablo -> 1 no.lu çubuktan 5-10 metre ileriye çakılan 2 no.lu çubuğa bağlanır (kablolar birbirine değmemeli).
  * Zemin kuruysa 1 ve 2 no.lu çubukların dibi su dökülerek nemlendirilir.
  * Ölçüm sırasında terminaller arasında yaklaşık 50 V AC gerilim oluşacağından çubuklara dokunulmamalıdır. Önce toprak gerilimi (earth voltage) ölçülür; değer sınırın üzerindeyse test yapılmaz.
- Global topraklama sistemi içerisindeki alanlarda toprak direncini veya gerilimini doğrulamaya gerek yoktur.
- Muayene, Ölçme ve Denetleme Periyotları:
  1) Elektrik üretim iletim ve dağıtım tesisleri (enerji nakil ve dağıtım hatları hariç): 2 yıl.
  2) Enerji nakil ve dağıtım hatları: 5 yıl.
  3) Sanayi tesisleri ve ticaret merkezleri:
     a) Topraklamalara ilişkin dirençlerin muayene ve ölçülmesi: 1 yıl.
     b) Topraklama tesisleri ile ilgili diğer muayene, ölçme ve kontroller: 2 yıl.
  4) Sabit olmayan tesisler için:
     a) Sabit işletme elemanları için: 1 yıl.
     b) Yer değiştirebilen işletme elemanları için: 6 ay.
  5) Parlayıcı, patlayıcı, tehlikeli ve zararlı maddelerle çalışılan işyerleri ile ıslak ortamlarda çalışılan işyerlerindeki topraklama tesislerinin periyotları 1 yılı aşamaz.
`;

let stream = null;
let facingMode = "environment";
let autoScanTimer = null;
let isAnalyzing = false;
let audioEnabled = true;

const MODELS = [
    "gemini-2.5-flash",
    "gemini-2.5-flash-lite",
    "gemini-2.0-flash",
    "gemini-2.0-flash-lite",
    "gemini-3.8-flash"
];

window.onload = () => {
    const savedKey = localStorage.getItem("gemini_api_key") || "";
    const savedInterval = localStorage.getItem("scan_interval") || "6000";
    const savedRate = localStorage.getItem("speech_rate") || "1.05";
    document.getElementById("apiKeyInput").value = savedKey;
    document.getElementById("intervalSelect").value = savedInterval;
    document.getElementById("rateSelect").value = savedRate;
    startCamera();
};

async function startCamera() {
    if (stream) {
        stream.getTracks().forEach(t => t.stop());
    }
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
        });
        const video = document.getElementById("video");
        video.srcObject = stream;
        setStatus("Kamera Hazır (v3.0 - S. 256-272 Yüklü)");
    } catch (err) {
        setStatus("Kamera Erişim Hatası! İzin verin.");
        showResult("Kamera açılamadı. Tarayıcı ayarlarından kamera izni verip sayfayı yenileyin.", true);
    }
}

function switchCamera() {
    facingMode = (facingMode === "environment") ? "user" : "environment";
    startCamera();
}

function toggleAudio() {
    audioEnabled = !audioEnabled;
    const btn = document.getElementById("btnAudio");
    if (audioEnabled) {
        btn.textContent = "🔊 Ses Açık";
        btn.classList.add("active");
    } else {
        btn.textContent = "🔇 Ses Kapalı";
        btn.classList.remove("active");
        window.speechSynthesis.cancel();
    }
}

function openSettings() {
    document.getElementById("settingsModal").style.display = "flex";
}

function closeSettings() {
    document.getElementById("settingsModal").style.display = "none";
}

function saveSettings() {
    const key = document.getElementById("apiKeyInput").value.trim();
    const interval = document.getElementById("intervalSelect").value;
    const rate = document.getElementById("rateSelect").value;
    localStorage.setItem("gemini_api_key", key);
    localStorage.setItem("scan_interval", interval);
    localStorage.setItem("speech_rate", rate);
    closeSettings();
    showResult("Ayarlar kaydedildi.", false, true);
    if (autoScanTimer) {
        toggleAutoScan();
        toggleAutoScan();
    }
}

function toggleAutoScan() {
    const btn = document.getElementById("btnAuto");
    if (autoScanTimer) {
        clearInterval(autoScanTimer);
        autoScanTimer = null;
        btn.innerHTML = "▶ Canlı Taramayı Başlat";
        btn.className = "btn-main btn-green";
        setStatus("Kamera Hazır (v3.0 - S. 256-272 Yüklü)");
    } else {
        const interval = parseInt(localStorage.getItem("scan_interval") || "6000", 10);
        btn.innerHTML = "⏹ Taramayı Durdur";
        btn.className = "btn-main btn-red";
        captureAndAnalyze();
        autoScanTimer = setInterval(() => {
            if (!isAnalyzing) captureAndAnalyze();
        }, interval);
    }
}

function setStatus(text) {
    document.getElementById("statusBadge").textContent = text;
}

function showResult(text, isError = false, isSuccess = false) {
    const box = document.getElementById("resultBox");
    box.textContent = text;
    box.className = "result-box" + (isError ? " error" : (isSuccess ? " success" : ""));
}

function speakText(text) {
    if (!audioEnabled || !("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "tr-TR";
    utterance.rate = parseFloat(localStorage.getItem("speech_rate") || "1.05");
    window.speechSynthesis.speak(utterance);
}

async function captureAndAnalyze() {
    if (isAnalyzing) return;
    const apiKey = localStorage.getItem("gemini_api_key") || "";
    if (!apiKey) {
        showResult("Lütfen sağ üstteki ⚙ API butonuna dokunup Gemini API anahtarınızı girin.", true);
        openSettings();
        return;
    }

    const video = document.getElementById("video");
    if (!video.videoWidth) {
        showResult("Kamera görüntüsü henüz hazır değil, lütfen bekleyin.", true);
        return;
    }

    isAnalyzing = true;
    setStatus("Soru Analiz Ediliyor... ⏳");

    const canvas = document.getElementById("canvas");
    const w = video.videoWidth;
    const h = video.videoHeight;
    // Crop center scan frame area
    const cropW = Math.floor(w * 0.90);
    const cropH = Math.floor(h * 0.55);
    const cropX = Math.floor((w - cropW) / 2);
    const cropY = Math.floor((h - cropH) / 2);

    canvas.width = cropW;
    canvas.height = cropH;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
    const base64Image = canvas.toDataURL("image/jpeg", 0.85).split(",")[1];

    const promptText = `Sen TEDAŞ Topraklamalar sınav asistanısın. Aşağıdaki TEDAŞ kitap bilgi bankasını temel alarak görüntüdeki soruyu/soruları tespit et ve Türkçe olarak çok net, kısa ve doğrudan sesli okunmaya uygun şekilde cevapla.
Eğer çoktan seçmeli soruysa önce soru numarasını, doğru şıkkı ve şıkkın metnini söyle (Örnek: "4. Soru: Cevap D şıkkı, Münferit topraklama."). Boşluk doldurma veya klasik soruysa doğrudan doğru cevabı söyle. Gereksiz giriş cümleleri kurma.

BİLGİ BANKASI:
${TEDAS_KNOWLEDGE_BASE}`;

    let lastError = "";
    let successAnswer = null;

    for (let i = 0; i < MODELS.length; i++) {
        const modelName = MODELS[i];
        setStatus(`Analiz Ediliyor (${modelName})... ⏳`);
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(apiKey)}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: promptText },
                            { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                        ]
                    }],
                    generationConfig: {
                        temperature: 0.1,
                        maxOutputTokens: 350
                    }
                })
            });

            const data = await response.json();
            if (!response.ok) {
                lastError = data?.error?.message || `HTTP ${response.status}`;
                continue; // Try next fallback model immediately
            }

            const candidateText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (candidateText) {
                successAnswer = candidateText.trim();
                break;
            } else {
                lastError = "Boş yanıt döndü.";
            }
        } catch (err) {
            lastError = err.message || "Bağlantı hatası";
        }
    }

    isAnalyzing = false;
    setStatus("Kamera Hazır (v3.0 - S. 256-272 Yüklü)");

    if (successAnswer) {
        showResult(successAnswer, false, true);
        speakText(successAnswer);
    } else {
        showResult(`Hata (Tüm modeller denendi): ${lastError}`, true);
    }
}
</script>
