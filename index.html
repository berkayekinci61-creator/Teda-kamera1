<!DOCTYPE html>
<html lang="tr">
<head>

  <meta name="theme-color" content="#0f172a">

  <title>TEDAŞ Topraklamalar - Canlı Kamera & Sesli Asistan</title>
  <link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;TEDAŞ Topraklamalar&quot;,&quot;short_name&quot;:&quot;TEDAŞ Kamera&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%230f172a&quot;,&quot;theme_color&quot;:&quot;%230f172a&quot;}">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #1e293b; border-bottom: 1px solid #334155; }
    .title { font-size: 16px; font-weight: 700; color: #facc15; display: flex; align-items: center; gap: 6px; }
    .header-btns { display: flex; gap: 8px; }
    button { border: none; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-top { background: #334155; color: #fff; }
    .btn-top.active { background: #0284c7; }
    .status-bar { text-align: center; padding: 6px; font-size: 12px; background: #1e293b; color: #94a3b8; border-bottom: 1px solid #334155; }
    .camera-wrapper { position: relative; flex: 1; background: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .scan-frame { position: absolute; width: 88%; height: 46%; border: 2px dashed #38bdf8; border-radius: 14px; box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.55); pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 10px; }
    .scan-hint { background: rgba(15, 23, 42, 0.85); color: #e2e8f0; font-size: 12px; padding: 4px 12px; border-radius: 20px; }
    .controls { display: flex; gap: 8px; padding: 12px 16px; background: #1e293b; border-top: 1px solid #334155; }
    .btn-auto { flex: 1.2; background: #16a34a; color: #fff; font-size: 14px; padding: 12px; }
    .btn-auto.stop { background: #dc2626; }
    .btn-now { flex: 1.2; background: #2563eb; color: #fff; font-size: 14px; padding: 12px; }
    .btn-flip { background: #334155; color: #fff; padding: 12px 14px; font-size: 16px; }
    .output-box { background: #1e293b; padding: 12px 16px; min-height: 110px; max-height: 155px; overflow-y: auto; border-top: 1px solid #334155; font-size: 14px; line-height: 1.45; color: #e2e8f0; }
    .output-box.error { background: #450a0a; color: #fca5a5; border-top-color: #991b1b; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50; justify-content: center; align-items: center; padding: 20px; }
    .modal.open { display: flex; }
    .modal-card { background: #1e293b; padding: 20px; border-radius: 14px; width: 100%; max-width: 400px; border: 1px solid #334155; }
    .modal-card h3 { margin-bottom: 14px; color: #facc15; font-size: 16px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
    .modal-actions button { flex: 1; padding: 10px; }
    .btn-save { background: #16a34a; color: #fff; }
    .btn-close { background: #475569; color: #fff; }
    canvas { display: none; }
  </style>
</head>
<body>

<header>
  <div class="title">⚡ TEDAŞ Topraklamalar</div>
  <div class="header-btns">
    <button id="btnSound" class="btn-top active">🔊 Ses Açık</button>
    <button id="btnSettings" class="btn-top">⚙ API</button>
  </div>
</header>

<div id="statusBar" class="status-bar">Kamera Hazır (v6.1 - Sadece Kitap S.256-272)</div>

<div class="camera-wrapper">
  <video id="video" autoplay playsinline muted></video>
  <div class="scan-frame">
    <span class="scan-hint">Soruyu çerçeveye ortalayın</span>
  </div>
</div>

<div class="controls">
  <button id="btnAuto" class="btn-auto">▶ Canlı Taramayı Başlat</button>
  <button id="btnNow" class="btn-now">⚡ Şimdi Oku</button>
  <button id="btnFlip" class="btn-flip">🔄</button>
</div>

<div id="outputBox" class="output-box">
  TEDAŞ Topraklamalar (v6.1 - Sadece Kitap S. 256–272) yüklendi. Soruyu çerçeveye ortalayıp "Şimdi Oku" butonuna basın.

<canvas id="canvas"></canvas>

<div id="settingsModal" class="modal">
  <div class="modal-card">
    <h3>⚙ API ve Asistan Ayarları</h3>
    <div class="form-group">
      <label>Gemini API Anahtarı (AIzaSy...)</label>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy...">
    </div>
    <div class="form-group">
      <label>Otomatik Tarama Aralığı (Saniye)</label>
      <select id="intervalInput">
        <option value="5000">5 Saniye</option>
        <option value="8000" selected>8 Saniye</option>
        <option value="12000">12 Saniye</option>
      </select>
    </div>
    <div class="form-group">
      <label>Konuşma Hızı</label>
      <select id="rateInput">
        <option value="0.9">Yavaş (0.9x)</option>
        <option value="1.0" selected>Normal (1.0x)</option>
        <option value="1.2">Hızlı (1.2x)</option>
      </select>
    </div>
    <div class="modal-actions">
      <button id="btnSaveSettings" class="btn-save">Kaydet</button>
      <button id="btnCloseSettings" class="btn-close">Kapat</button>
    </div>
  </div>
</div>

const KITAP_BILGI_BANKASI = `
KAYNAK: TEDAŞ TOPRAKLAMALAR KİTABI (SAYFA 256 - 272)

[SAYFA 256 - TOPRAKLAMA TANIMI, AMAÇLARI VE ELEMANLARI]
- Tanım: Tesislerin gerilim altında olmayan kısımlarının ve bazı teçhizatın yıldız noktasının uygun iletkenlerle yer kütle içerisine yerleştirilmiş bir topraklayıcıya bağlanmasına topraklama denir. Elektrik üretim, iletim ve dağıtım tesislerinde insan hayatının ve teçhizatın korunmasını sağlar.
- İki Ana Amaç: 1) Topraklanacak cihaz/bölüm ile referans toprak arasındaki direncin olabildiğince küçük olmasını sağlamak; oluşabilecek hata akımını mümkün olduğunca büyütmek. 2) İşletme esnasında cihazların, bina aksamının ve benzeri elemanların arasında oluşabilecek potansiyel farkı engellemek.
- Topraklayıcılar:
  * 2 m boyunda NPL 65x65x7 mm galvanizli çelik profil
  * 2 m boyunda, 3 mm et kalınlığında, 2,5 parmak (6,35 cm) çapında galvanizli boru
  * 2,5 m boyunda, 3 mm bakır kaplı, 22 mm çapında çelik çubuk
  * 0,5 x 1 m ebatında, 3 mm et kalınlığında galvanizli çelik levha
- Topraklama İletkenleri:
  * 1x50 mm² NYY kablo (Trafo güçlerine göre kesiti artırılır - İşletme topraklamasında)
  * 35 mm² kesitinde çıplak örgülü bakır iletken (SDK ve aydınlatma tesislerindeki koruma topraklamasında)
  * 95 mm² galvanizli örgülü çelik iletken (ENH koruma topraklamasında ve parafudr topraklamalarında)
  * 35x3 mm (100 mm²) boyutunda galvanizli çelik şerit (Koruma topraklamaları)
  * 95 mm² kesitinde çıplak örgülü bakır iletken (Dağıtım ve transformatör merkezlerinde koruma topraklamasında)

[SAYFA 257 - TOPRAKLAMA SINIFLANDIRMASI]
1) Çeşitlerine Göre Topraklama:
   - Dolaysız Topraklama: Topraklama direncinden başka hiçbir direnç içermeyen topraklamadır.
   - Dolaylı Topraklama: Topraklama iletkeni üzerine ek olarak bağlanan omik, endüktif veya kapasitif dirençlerle yapılan topraklamadır.
   - Açık Topraklama: Topraklama iletkeni üzerine bir parafudr veya eklatör bağlanan topraklamadır.
2) Amaçlarına Göre Topraklama:
   - Koruma Topraklaması
   - İşletme Topraklaması
   - Fonksiyonel Topraklama
3) Şekillerine Göre Topraklama:
   - Münferit Topraklama: İşletme elemanı veya cihazın kendine ait topraklayıcıya bağlı olduğu topraklamadır.
   - Yıldız Topraklama: Topraklama iletkenlerinin topraklanmış bir noktada yıldız şeklinde toplanmasıdır.
   - Çoklu Topraklama: Bir işletme elemanı veya cihazın topraklanmış birçok iletkene bağlandığı topraklamadır.
   - Yüzeysel Topraklama: Akım taşımayan iletken kısımların ağ şeklinde kendi aralarında koruma veya fonksiyon topraklamasına bağlandığı topraklamadır.

[SAYFA 258-259 - AMAÇLARINA GÖRE DETAYLAR VE MAHALLİ TOPRAKLAMA]
- Koruma Topraklaması: Uygun işletme şartları içerisinde gerilim altında bulunmayan ancak arıza oluştuğunda gerilim altında olabilecek metal bölümlerin bir iletken yolu ile topraklayıcıya bağlanmasıdır. Amaç: İnsan vücudu üzerinden geçebilecek akımı az tutmak ve koruma cihazlarının çalışmasını sağlayarak arızalı kısmın hızla devre dışı olmasını sağlamaktır.
- İşletme Topraklaması: Transformatörlerin veya jeneratörlerin dışarı çıkartılmış yıldız (nötr) noktalarında toprağa karşı oluşacak gerilimin sınırlandırılması için yapılan topraklamadır (Direk tip trafolar, AG direkleri, SDK ve aydınlatma direkleri, müşterek direkler, TR ve KÖK binaları).
- Fonksiyonel (Özel) Topraklama: Tesisin veya işletme elemanının istenen fonksiyonu yerine getirmesi amacıyla yapılan topraklamadır (Paratoner, raylı sistem, zayıf akım topraklaması vb.).
- Mahalli Topraklama: Çalışma mahallinin en yakın yerinde yapılan topraklamalardır. Arıza ve bakım hallerinde enerjisi kesilmiş tesislerde güvenli çalışmayı sağlamak amacıyla yapılır (Kısa devre topraklama aparatları ile toprağa irtibatlanır).
