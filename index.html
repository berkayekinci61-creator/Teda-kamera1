<script>
const BOOK_KNOWLEDGE = "TEDAŞ TOPRAKLAMALAR KİTABI TAM BİLGİ BANKASI (SAYFA 256 - 272):\n\n[SAYFA 256: 12. TOPRAKLAMALAR VE ELEMANLARI]\n- Topraklama Tanımı: Tesislerin gerilim altında olmayan kısımlarının ve bazı teçhizatın yıldız noktasının uygun iletkenlerle yer kütle içerisine yerleştirilmiş bir topraklayıcıya bağlanmasına topraklama denir. Elektrik üretim, iletim ve dağıtım tesislerinde insan hayatının ve teçhizatın korunmasını sağlar.\n- Topraklamanın İki Ana Amacı:\n  1. Topraklanacak cihaz veya bölüm ile referans toprak arasındaki direncin olabildiğince küçük olmasını sağlamak; oluşabilecek hata akımını mümkün olduğunca büyütmek.\n  2. İşletme esnasında; cihazların, bina aksamının ve benzeri elemanların arasında oluşabilecek potansiyel farkı engellemek.\n- 12.1.1. Topraklayıcılar (Ebat ve Özellikleri):\n  * 2 m boyunda NPL 65 x 65 x 7 mm galvanizli çelik profil\n  * 2 m boyunda; 3 mm et kalınlığında, 2,5 parmak (6,35 cm) çapında galvanizli boru\n  * 2,5 m boyunda; 3 mm bakır kaplı, 22 mm çapında çelik çubuk\n  * 0,5 x 1 m ebatında 3 mm et kalınlığında galvanizli çelik levha\n- 12.1.2. Topraklama İletkenleri ve Kullanım Yerleri:\n  * 1x50 mm2'lik NYY kablo (Kullanılan transformatör güçlerine bağlı olarak kesiti artırılır) -> İşletme topraklamasında\n  * 35 mm2 kesitinde çıplak örgülü bakır iletken -> Saha dağıtım kutusu ve aydınlatma tesislerindeki koruma topraklamasında\n  * 95 mm2 galvanizli örgülü çelik iletken -> ENH koruma topraklamasında ve parafudr topraklamalarında\n  * 35x3 mm (100 mm2) boyutunda galvanizli çelik şerit -> Koruma topraklamaları\n  * 95 mm2 kesitinde çıplak örgülü bakır iletken -> Dağıtım ve transformatör merkezlerinde koruma topraklamasında\n\n[SAYFA 257: TOPRAKLAMA SINIFLANDIRMASI]\n1. ÇEŞİTLERİNE GÖRE TOPRAKLAMA:\n   - Dolaysız Topraklama: Topraklama direncinden başka hiçbir direnç içermeyen topraklamadır.\n   - Dolaylı Topraklama: Topraklama iletkeni üzerine ek olarak bağlanan omik, endüktif veya kapasitif dirençlerle yapılan topraklamadır.\n   - Açık Topraklama: Topraklama iletkeni üzerine bir parafudr veya eklatör bağlanan topraklamadır.\n2. AMAÇLARINA GÖRE TOPRAKLAMA:\n   - Koruma Topraklaması\n   - İşletme Topraklaması\n   - Fonksiyonel Topraklama\n3. ŞEKİLLERİNE GÖRE TOPRAKLAMA:\n   - Münferit Topraklama: İşletme elemanı veya cihazın kendine ait topraklayıcıya bağlı olduğu topraklamadır.\n   - Yıldız Topraklama: Topraklama iletkenlerinin, topraklanmış bir noktada, yıldız şeklinde toplanmasıdır.\n   - Çoklu Topraklama: Bir işletme elemanı veya cihazın topraklanmış birçok iletkene bağlandığı topraklamadır.\n   - Yüzeysel Topraklama: Akım taşımayan iletken kısımların ağ şeklinde kendi aralarında koruma veya fonksiyon topraklamasına bağlandığı topraklamadır.\n\n[SAYFA 258-259: AMAÇLARINA GÖRE TOPRAKLAMA ÇEŞİTLERİ VE MAHALLİ TOPRAKLAMA]\n- 12.2.1. Koruma Topraklaması: Uygun işletme şartları içerisinde, gerilim altında bulunmayan; ancak arıza oluştuğunda gerilim altında olabilecek metal bölümlerin bir iletken yolu ile topraklayıcıya bağlanmasıdır. Amaç: Hata halinde insan vücudu üzerinden geçebilecek akımı olduğunca az tutmak ve devredeki koruma cihazlarının çalışmasını sağlayarak arızalı kısmın hızla devre dışı olmasını sağlamak.\n  Uygulama alanları: AG Direkleri, Müşterek Direkler ve ENH Direklerinde koruma topraklaması; Direk Tipi Transformatörlerde Koruma ve Parafudr Topraklaması; SDK ve Aydınlatma Direklerinin Koruma Topraklaması; Müşterek Direklerde Koruma Topraklaması; Kırsal Kesim ENH ve Dağıtım Hatlarında; Trafo ve Kök Binalarında; İndirici ve Dağıtım Merkezlerinde; YG Yer altı Kablo Tesislerinde; Elektrik motorları, jeneratörler, transformatörler, ENH direk ve traverslerinin metal kısımları; Binaların iletken olan ve ulaşılabilen kısımları; Ölçü transformatörlerinde sekonder sargıların polarite olmayan uçları; YG havai hatların koruma telleri; AG ve YG kumanda panosu metal aksamları.\n- 12.2.2. İşletme Topraklaması: Transformatörlerin veya jeneratörlerin dışarı çıkartılmış yıldız (nötr) noktalarında toprağa karşı oluşacak gerilimin sınırlandırılması için yapılan topraklamadır.\n  Uygulama alanları: Direk Tip Transformatörlerde, AG Direklerinde, SDK ve Aydınlatma Direklerinde, Müşterek Direklerde, Transformatör ve Kök Binalarında İşletme Topraklaması.\n- 12.2.3. Fonksiyonel (Özel) Topraklama: Tesisin veya işletme elemanının istenen fonksiyonu yerine getirmesi amacıyla yapılan topraklamadır. Koruma ve işletme topraklamalarının dışında yapılan mahalli topraklama, paratoner topraklama, raylı sistem topraklama, zayıf akım topraklama vb. fonksiyonel topraklama çeşitleridir. Bunlar içerisinde mahalli topraklama iş güvenliği açısından önem arz etmektedir.\n- 12.2.4. Mahalli Topraklama: Çalışma mahallinin en yakın yerinde yapılan topraklamalardır. Arıza ve bakım hallerinde enerjisi kesilmiş tesislerde, güvenli çalışmayı sağlamak amacıyla yapılır. Enerjisi kesilmiş çalışma mahallindeki tesisin enerji taşıyan kısımlarının uygun kısa devre topraklama aparatları ile çalışma süresince toprağa irtibatlanmasıdır.\n\n[SAYFA 260-261: 12.3. DAĞITIM ŞEBEKELERİNİN TOPRAKLAMA TİPİNE GÖRE SINIFLANDIRILMASI]\n- 3 ana tipe ayrılır: TT Sistemi, IT Sistemi, TN Sistemi.\n- Harflerin Anlamı:\n  * Birinci harf (Güç sisteminin toprağa bağlantısı): T = Bir noktanın toprağa doğrudan bağlandığını; I = Bütün gerilimli bölümlerin topraktan ayrılmış olması veya bir noktadan ve bir empedans üzerinden toprağa bağlandığını ifade eder.\n  * İkinci harf (Tesisatın açıktaki iletken bölümlerinin toprağa bağlantısı): T = Güç sisteminin herhangi bir noktasının topraklamasından bağımsız olarak açıktaki iletken bölümlerin elektriksel olarak doğrudan toprağa bağlandığını; N = Açıktaki iletken bölümlerin güç sisteminin topraklanmış noktasına elektriksel olarak doğrudan bağlandığını (AC sistemlerde normal olarak nötr noktası veya yoksa bir faz iletkeni) ifade eder.\n  * Sonraki harf (Nötr ve koruma iletkeninin düzenlenmesi): S = Nötr veya topraklanmış hat iletkeninden ayrı bir iletkenle koruma fonksiyonunun sağlanması; C = Nötr ve koruma fonksiyonlarının tek iletken üzerinden birleştirilerek sağlanması (PEN iletkeni).\n- TT Sistemleri: Doğrudan topraklanmış bir nokta bulunur. Tesisatın açıktaki iletken bölümleri, güç sistemi topraklayıcısından elektriksel olarak bağımsız olan topraklayıcıya bağlanır. Alçak Gerilim Tesislerinde Topraklama olarak adlandırılır.\n- IT Sistemi: Bütün gerilimli bölümler topraktan ayrılır veya bir noktadan bir empedans üzerinden toprağa bağlanır. Açıktaki iletken bölümler ayrı ayrı veya birleşik olarak topraklanır veya sistem topraklamasına bağlanır.\n- TN Sistemleri: Doğrudan topraklanmış bir nokta bulunur ve tesisatın açıktaki iletken bölümleri bu noktaya koruma iletkeni ile bağlanır. 3 tipe ayrılır:\n  * TN-S sistemi: Sistemin tamamında ayrı bir koruma iletkeni (PE) ve ayrı nötr iletkeni (N) kullanılır.\n  * TN-C sistemi: Sistemin tamamında nötr ve koruma fonksiyonları tek iletkende (PEN) birleştirilmiştir.\n  * TN-C-S sistemi: Nötr ve koruma fonksiyonları, sistemin bir bölümünde tek iletkende (PEN) birleştirilmiştir, sonra PE ve N olarak ayrılır.\n\n[SAYFA 262-268: 12.4. DAĞITIM ŞEBEKELERİNDE TOPRAKLAMA UYGULAMALARI VE ŞEMA ÖLÇÜLERİ]\n- Direk Tipi Transformatörlerde Topraklama (S. 262):\n  * Parafudrlar en kısa yoldan kesintisiz olarak 95 mm2 örgülü çelik iletkenle topraklayıcıya bağlanır. Parafudrlar topraklama iletkenine fleksibl iletkenle irtibatlandırılacaktır.\n  * Koruma topraklama kazığı ile İşletme topraklama kazığı arası: En az 20 m.\n  * Gömülme derinliği: En az 50 cm (50-100 cm). İşletme topraklaması 1x50 Cu NYY ile pano nötr barasına gider.\n- AG Direkleri Topraklaması (S. 263):\n  * 2,15 m boyunda gaz borusu veya PVC boru içinden 1x50 mm2 NYY iletken geçer.\n  * Topraklayıcı boyu 2 m, gömülme derinliği 50 cm.\n  * Koruma topraklaması ile işletme topraklaması arası: 20 m.\n  * Not: (a) mesafesi topraklayıcı boyunun iki katı olacaktır (2 m topraklayıcı için a = 4 metre kazı uzunluğu).\n- Saha Dağıtım Kutusu (SDK) ve Aydınlatma Tesisleri (S. 264-265):\n  * SDK ile aydınlatma direklerinin kablosu aynı kanala döşendiği takdirde topraklama iletkeni (1x35 mm2 çıplak örgülü bakır iletken) her ikisi için birlikte kullanılır.\n  * Koruma ve işletme topraklaması arası en az 20 m, gömülme derinliği en az 50 cm.\n- Müşterek Direkler ve Boyalı Kaynaklı ENH Demir Direkleri (S. 266-267):\n  * Müşterek demir direklerde AG'nin nihayet olması durumunda koruma ve işletme topraklaması aynı direkte birlikte yapılır (aralarında 20 m mesafe korunur).\n  * Boyalı kaynaklı ENH demir direğinde koruma topraklaması: 95 mm2 örgülü galvanizli çelik iletken, 50 cm derinlik, 2 m topraklayıcı, (a) mesafesi topraklayıcı boyunun iki katı (4 m).\n- Elektrik Dağıtım Tesisleri Binalarında (TR Binası ve K.Ö.K) Topraklama (S. 268):\n  * TR Binası, K.Ö.K, İndirici ve dağıtım merkezlerinde Izgara topraklama sistemi uygulanır.\n  * Not: Topraklama ağ şebekesi en az 50 cm toprak altına gömülecek, şebekenin kontrolü için topraklayıcı kazıklarının bulunduğu yerlere 40x40 cm rögar yapılacaktır.\n\n[SAYFA 269: 12.5. TEMEL TOPRAKLAMA VE 12.6. DİKKAT EDİLECEK HUSUSLAR]\n- 12.5. Temel Topraklama: Potansiyel dengelemesinin etkisini arttırır. Kuvvetli akım tesislerinde ve yıldırıma karşı koruma tesislerinde topraklayıcı olarak uygundur. En az 150 cm'lik bağlantı filizi bırakılır, beton içinde en az 5 cm pay kalır.\n- 12.6. Topraklama Yapılırken Dikkat Edilecek Hususlar:\n  1. Havai hat şebekelerinde işletme ve koruma topraklamalarının mümkün olduğunca hat güzergâhı altına gelmemelidir.\n  2. Havai hat şebekelerinde yapılan işletme topraklamalarına ait topraklama iletkeni arıza dışında da gerilim altında olabileceğinden izole kablo olarak tesis edilmelidir.\n  3. Topraklayıcı olarak uygun elektrot kullanılması gereklidir (2 m boyunda NPL 65x65x7 mm galvanizli profil).\n  4. İstenilen toprak geçiş direnç değeri sağlanamadığı takdirde, topraklayıcı yapım şekli ve sayıları artırılarak paralel bağlanıp istenilen toprak geçiş direnci sağlanmalıdır.\n  5. Topraklayıcıların birbirini etkilememesi için topraklayıcılar arasındaki mesafenin elektrot uzunluğunun 2 katı olmalıdır.\n  6. 1kV 50 mm2 NYY kablo ile yapılan işletme topraklamalarında kablonun dış etkenlere karşı korunması amacıyla direk temel üstünden başlamak üzere 2 m boyunda gaz borusu veya PVC ile muhafaza altına alınmalıdır.\n  7. Topraklama şeridi veya topraklama iletkeni yüzeyden 0,5-1 m derinliğe gömülmelidir.\n  8. İşletme topraklaması ile koruma topraklaması arasında en az 20 metre mesafe olmalıdır.\n\n[SAYFA 270: 12.7. TOPRAKLAMA DİRENÇ DEĞERİNİN ÖLÇÜLMESİ]\n- Direnç ölçümü yapılmadan önce, topraklama iletkeni veya topraklama şeridi teçhizattan ayrılmalıdır.\n- Bağlantı Sırası (Elektronik Topraklama Ölçüm Cihazı - Meger):\n  * E (toprak ucu) terminaline bağlı YEŞİL renkli kablo -> Ölçüm yapılacak tesisin topraklama elektrotuna bağlanır.\n  * P (gerilim ucu) terminaline bağlı SARI renkli kablo -> Topraklama elektrotundan 5-10 metre ileriye çakılan 1 no.lu topraklama çubuğuna bağlanır.\n  * C (akım ucu) terminaline bağlı KIRMIZI renkli kablo -> 1 no.lu çubuktan 5-10 metre ileriye çakılan 2 no.lu topraklama çubuğuna bağlanır.\n  * Kablolar birbirine değmemeli ve birbiri üzerinden geçmemelidir.\n- Zemin kuru/taşlı ise 1 ve 2 no.lu çubukların dibine su dökülerek nemlendirilmelidir.\n- Komütatör önce en düşük kademeye (20 Ohm) getirilir, değer görülmezse bir üst kademeye (200 Ohm -> 2000 Ohm) alınır (test butonuna basılı iken kademe değiştirilmez).\n- Güvenlik Uyarısı: Ölçüm sırasında terminaller arasında yaklaşık 50 V AC gerilim oluşacağından test çubuklarına dokunulmamalıdır. Önce toprak gerilimi (earth voltage) kademesinde ölçüm yapılır; izin verilen sınırın üzerindeyse test yapılmaz.\n\n[SAYFA 271: 12.8. DOKÜMANTASYON VE DENETİM AYRINTILARI]\n- Saha uygulama ve denetleme planı bulunmalıdır.\n- Global topraklama sisteminin dışında her tesisin toprak direnci hesaplanmalı ve sistematik ölçülmelidir. Global topraklama sistemi içerisindeki alanlarda toprak direncini veya gerilimini doğrulamaya gerek yoktur (temel tasarımı yeterlidir).\n\n[SAYFA 272: MUAYENE, ÖLÇME VE DENETLEME PERİYOTLARI]\n1. Elektrik üretim iletim ve dağıtım tesisleri (enerji nakil ve dağıtım hatları hariç): 2 yıl\n2. Enerji nakil ve dağıtım hatları: 5 yıl\n3. Sanayi tesisleri ve ticaret merkezleri:\n   a) Topraklamalara ilişkin dirençlerinin muayene ve ölçülmesi: 1 yıl\n   b) Topraklama tesisleri ile ilgili diğer muayene, ölçme ve kontroller: 2 yıl\n4. Sabit olmayan tesisler:\n   a) Sabit işletme elemanları için: 1 yıl\n   b) Yer değiştirebilen işletme elemanları için: 6 ay\n5. Parlayıcı, Patlayıcı Tehlikeli ve Zararlı Maddelerle Çalışılan İşyerleri ve İşlerde Alınacak Tedbirler Hakkında Tüzük kapsamındaki topraklama tesisleri ile ıslak ortamlarda çalışılan işyerlerindeki topraklama tesislerinin muayene, ölçme ve denetleme periyotları: 1 yılı aşamaz.";

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const statusPill = document.getElementById('status-pill');
const resultBox = document.getElementById('result-box');
const btnAuto = document.getElementById('btn-auto');
const btnNow = document.getElementById('btn-now');
const btnFlip = document.getElementById('btn-flip');
const btnSound = document.getElementById('btn-sound');
const btnSettings = document.getElementById('btn-settings');
const modal = document.getElementById('modal');
const apiKeyInput = document.getElementById('api-key-input');
const intervalSelect = document.getElementById('interval-select');
const rateSelect = document.getElementById('rate-select');

let stream = null;
let facingMode = 'environment';
let autoTimer = null;
let isScanning = false;
let soundEnabled = true;
let lastAnswer = '';

apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
intervalSelect.value = localStorage.getItem('scan_interval') || '5000';
rateSelect.value = localStorage.getItem('speech_rate') || '0.95';

async function startCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;
    statusPill.textContent = 'Kamera Hazır ✅';
  } catch (err) {
    statusPill.textContent = 'Kamera İzni Gerekli ❌';
    resultBox.className = 'error';
    resultBox.textContent = 'Kamera açılamadı. Lütfen tarayıcı ayarlarından kamera izni verin ve sayfayı HTTPS üzerinden açın.';
  }
}

btnFlip.onclick = () => {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  startCamera();
};

btnSound.onclick = () => {
  soundEnabled = !soundEnabled;
  btnSound.textContent = soundEnabled ? '🔊 Ses Açık' : '🔇 Ses Kapalı';
  btnSound.classList.toggle('active', soundEnabled);
  if (!soundEnabled && 'speechSynthesis' in window) window.speechSynthesis.cancel();
};

btnSettings.onclick = () => { modal.style.display = 'flex'; };
document.getElementById('btn-close-modal').onclick = () => { modal.style.display = 'none'; };
document.getElementById('btn-save-settings').onclick = () => {
  localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
  localStorage.setItem('scan_interval', intervalSelect.value);
  localStorage.setItem('speech_rate', rateSelect.value);
  modal.style.display = 'none';
  statusPill.textContent = 'Ayarlar Kaydedildi ✅';
};

function speakText(text) {
  if (!soundEnabled || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const cleanText = text.replace(/[*#_]/g, '');
  const utter = new SpeechSynthesisUtterance(cleanText);
  utter.lang = 'tr-TR';
  utter.rate = parseFloat(rateSelect.value) || 0.95;
  window.speechSynthesis.speak(utter);
}

function captureFrameBase64() {
  if (!video.videoWidth) return null;
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  const cw = Math.floor(vw * 0.86);
  const ch = Math.floor(vh * 0.52);
  const sx = Math.floor((vw - cw) / 2);
  const sy = Math.floor((vh - ch) / 2);
  canvas.width = cw;
  canvas.height = ch;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, sx, sy, cw, ch, 0, 0, cw, ch);
  return canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
}

async function callGeminiWithFallback(apiKey, base64Img) {
  const models = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-3.8-flash'];
  const prompt = `Sen TEDAŞ Topraklamalar eğitim ve saha sınavı asistanısın. Aşağıdaki resmi kitap bilgi bankasını (Sayfa 256-272) öncelikli kesin kaynak olarak kullan:

${BOOK_KNOWLEDGE}

GÖREV: Görüntüdeki soruyu (çoktan seçmeli, boşluk doldurma veya açık uçlu) oku ve yukarıdaki kitap bilgilerine göre doğrudan, net, kısa ve sesli okunmaya uygun Türkçe cevap ver. Çoktan seçmeli ise önce doğru şıkkı ve metnini söyle, ardından 1 cümlelik kısa gerekçe ekle. Görüntüde soru yoksa sadece "Çerçevede soru algılanmadı" yaz.`;

  let lastErr = '';
  for (const model of models) {
    try {
      const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: prompt },
              { inline_data: { mime_type: 'image/jpeg', data: base64Img } }
            ]
          }],
          generationConfig: { temperature: 0.1, maxOutputTokens: 300 }
        })
      });
      const data = await resp.json();
      if (!resp.ok) {
        lastErr = data?.error?.message || `HTTP ${resp.status}`;
        continue;
      }
      const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (text) return text.trim();
    } catch (e) {
      lastErr = e.message;
    }
  }
  throw new Error(lastErr || 'API yanıt vermedi.');
}

async function analyzeFrame(isAuto = false) {
  if (isScanning) return;
  const apiKey = (apiKeyInput.value || localStorage.getItem('gemini_api_key') || '').trim();
  if (!apiKey) {
    statusPill.textContent = 'API Anahtarı Eksik ⚠️';
    resultBox.className = 'error';
    resultBox.textContent = 'Lütfen sağ üstteki ⚙ API butonuna dokunup Gemini API anahtarınızı girin.';
    if (autoTimer) toggleAuto();
    return;
  }

  const base64Img = captureFrameBase64();
  if (!base64Img) return;

  isScanning = true;
  statusPill.textContent = 'Soru Analiz Ediliyor... ⏳';

  try {
    const answer = await callGeminiWithFallback(apiKey, base64Img);
    resultBox.className = '';
    resultBox.textContent = answer;
    statusPill.textContent = 'Cevap Hazır ✅';
    if (!answer.includes('algılanmadı') && (!isAuto || answer !== lastAnswer)) {
      lastAnswer = answer;
      speakText(answer);
    }
  } catch (err) {
    statusPill.textContent = 'API Hatası ❌';
    resultBox.className = 'error';
    resultBox.textContent = 'Hata: ' + err.message;
  } finally {
    isScanning = false;
  }
}

function toggleAuto() {
  if (autoTimer) {
    clearInterval(autoTimer);
    autoTimer = null;
    btnAuto.textContent = '▶ Canlı Taramayı Başlat';
    btnAuto.classList.remove('running');
    statusPill.textContent = 'Tarama Durduruldu';
  } else {
    const ms = parseInt(intervalSelect.value, 10) || 5000;
    btnAuto.textContent = '⏹ Taramayı Durdur';
    btnAuto.classList.add('running');
    analyzeFrame(true);
    autoTimer = setInterval(() => analyzeFrame(true), ms);
  }
}

btnAuto.onclick = toggleAuto;
btnNow.onclick = () => analyzeFrame(false);

startCamera();
</script>
